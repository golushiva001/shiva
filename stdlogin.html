<!DOCTYPE html>
<html lang="hi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: Arial, Helvetica, sans-serif;
			color: #172554;
			background: linear-gradient(135deg, #e0f2fe, #eef2ff 55%, #f5f3ff);
		}
		.login-card {
			width: min(100%, 420px);
			padding: 38px;
			border: 1px solid rgba(255,255,255,.8);
			border-radius: 22px;
			background: rgba(255,255,255,.94);
			box-shadow: 0 24px 70px rgba(30,64,175,.14);
		}
		.brand-mark {
			width: 52px;
			height: 52px;
			display: grid;
			place-items: center;
			margin-bottom: 24px;
			border-radius: 16px;
			background: #2563eb;
			color: white;
			font-size: 25px;
		}
		h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.5px; }
		.subtitle { margin: 0 0 28px; color: #64748b; line-height: 1.5; }
		.field { margin-bottom: 19px; }
		label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
		input[type="text"], input[type="password"] {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid #cbd5e1;
			border-radius: 10px;
			outline: none;
			color: #0f172a;
			font: inherit;
			transition: border-color .2s, box-shadow .2s;
		}
		input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.14); }
		.options { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 2px 0 23px; font-size: 13px; }
		.remember { display: flex; align-items: center; gap: 7px; color: #475569; }
		.remember input { width: 15px; height: 15px; margin: 0; accent-color: #2563eb; }
		a { color: #2563eb; text-decoration: none; }
		a:hover { text-decoration: underline; }
		button {
			width: 100%;
			padding: 14px;
			border: 0;
			border-radius: 10px;
			background: #2563eb;
			color: #fff;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
			transition: background .2s, transform .2s;
		}
		button:hover { background: #1d4ed8; transform: translateY(-1px); }
		.signup { margin: 22px 0 0; text-align: center; color: #64748b; font-size: 14px; }
		@media (max-width: 480px) { .login-card { padding: 28px 22px; } }
	</style>
</head>
<body>
	<main class="login-card">
		<div class="brand-mark" aria-hidden="true">🎓</div>
		<h1>Student Login</h1>
		<p class="subtitle">अपने छात्र खाते में लॉग इन करें।</p>
		<form action="#" method="post">
			<div class="field">
				<label for="student-id">Student ID या ईमेल</label>
				<input id="student-id" name="student-id" type="text" placeholder="अपना ID या ईमेल लिखें" autocomplete="username" required>
			</div>
			<div class="field">
				<label for="password">पासवर्ड</label>
				<input id="password" name="password" type="password" placeholder="अपना पासवर्ड लिखें" autocomplete="current-password" required>
			</div>
			<div class="options">
				<label class="remember"><input type="checkbox" name="remember"> मुझे याद रखें</label>
				<a href="#">पासवर्ड भूल गए?</a>
			</div>
			<button type="submit">लॉग इन करें</button>
		</form>
		<p class="signup">नया खाता चाहिए? <a href="#">साइन अप करें</a></p>
	</main>
</body>
</html>
