
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #e8f2ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0 15px;
        }

        .login-container {
            width: 100%;
            max-width: 560px;
            background: #fff;
            padding: 35px 24px 20px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        h2 {
            font-size: 24px;
            color: #111;
            margin-bottom: 22px;
        }

        .info {
            font-size: 14px;
            color: #52719f;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #080808;
        }

        input, select {
            width: 100%;
            height: 46px;
            padding: 10px 14px;
            border: 1px solid #c5d3e6;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #2450e8;
        }

        input::placeholder {
            color: #777;
        }

        button {
            background: #204be5;
            color: white;
            border: none;
            padding: 13px 19px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 6px;
        }

        button:hover {
            background: #1538bd;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 18px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Exam Header</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .header {
            width: 100%;
            min-height: 95px;
            background: linear-gradient(
                to right,
                #111a32,
                #214ed4
            );
            border: 1px solid #ddd;
            text-align: center;
            padding: 17px 10px;
            color: white;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .courses {
            font-size: 16px;
            color: white;
        }

        .courses a {
            color: white;
            text-decoration: none;
            padding: 0 3px;
        }

        .courses a:hover {
            text-decoration: underline;
            color: #ffeb3b;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .courses {
                font-size: 13px;
                line-height: 1.8;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="col-1"></div>

        <h1>
            Rama Technical Degree College - Online Exam
        </h1>

        <div class="courses">
            <a href="#">Computer Fundamental</a> |
            <a href="#">MS Word</a> |
            <a href="#">MS Excel</a> |
            <a href="#">PowerPoint</a> |
            <a href="#">Tally Prime</a>
        </div>

    </div>

</body>
</html>


    <div class="login-container">
        

        <h2>Student Login</h2>

        <p class="info">
            Password सही होने पर ही exam start होगा।
            एक Name + Roll Number से test केवल एक बार होगा।
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label>Student Name</label>
                <input type="text"
                       id="studentName"
                       placeholder="Student Name"
                       required>
            </div>

            <div class="form-group">
                <label>Father's Name</label>
                <input type="text"
                       id="fatherName"
                       placeholder="Father Name"
                       required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select id="course" required>
                    <option value="">-- Course Select करें --</option>
                    <option value="ADCA">ADCA</option>
                    <option value="DCA">DCA</option>
                    <option value="CCC">CCC</option>
                    <option value="O Level">O Level</option>
                    <option value="Tally">Tally</option>
                    <option value="DFA">DFA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Roll Number</label>
                <input type="text"
                       id="rollNumber"
                       placeholder="जैसे NK1015"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       id="password"
                       placeholder="Password"
                       required>
            </div>

            <button type="submit">Submit</button>

        </form>

    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const studentName =
                document.getElementById("studentName").value.trim();

            const fatherName =
                document.getElementById("fatherName").value.trim();

            const course =
                document.getElementById("course").value;

            const rollNumber =
                document.getElementById("rollNumber").value.trim();

            const password =
                document.getElementById("password").value;

            if (!studentName || !fatherName ||
                !course || !rollNumber || !password) {

                alert("कृपया सभी जानकारी भरें।");
                return;
            }

            // Demo login validation
            // Real password validation ke liye backend zaroori hai.

            if (password === "12345") {

                alert("Login Successful! Exam Start होगा।");

                console.log({
                    studentName,
                    fatherName,
                    course,
                    rollNumber
                });

                // Yahan exam page par redirect kar sakte hain.
                // window.location.href = "exam.html";

            } else {
                alert("Wrong Password! कृपया सही Password डालें।");
            }

        });
    </script>
</div>

</body>
</html>
