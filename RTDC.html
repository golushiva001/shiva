<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rama Computer Center - Admin Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #009de5;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 5px;
}

.login-container {
    width: 420px;
    max-width: 100%;
    min-height: 538px;
    background: #eaf6ff;
    border-radius: 20px;
    padding: 56px 35px 40px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #0878ff;
    font-size: 28px;
    margin-bottom: 20px;
    white-space: nowrap;
}

h3 {
    text-align: center;
    margin-bottom: 27px;
}

h3 span {
    background: #2864d9;
    color: white;
    font-size: 19px;
}

.form-group {
    margin-bottom: 16px;
}

input[type="text"],
input[type="password"],
select {
    width: 100%;
    height: 38px;
    border: none;
    outline: none;
    background: #f0f0f0;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 14px;
}

select {
    cursor: pointer;
}

.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 25px 0 28px;
    font-size: 14px;
    color: #222;
}

.remember input {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

button {
    width: 100%;
    height: 39px;
    border: none;
    border-radius: 9px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn {
    background: #0878ff;
    margin-bottom: 10px;
}

.change-btn {
    background: #f50057;
    margin-bottom: 17px;
}

button:hover {
    opacity: 0.88;
}

.links {
    text-align: center;
    font-size: 14px;
}

.links a {
    color: #006eff;
    text-decoration: underline;
}

@media(max-width: 450px) {
    .login-container {
        padding: 55px 25px 40px;
    }

    h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <h1>Rama Computer Center</h1>

    <h3><span>Admin Login</span></h3>

    <form id="loginForm">

        <div class="form-group">
            <input type="text" id="username"
            placeholder="Enter Username" required>
        </div>

        <div class="form-group">
            <input type="password" id="password"
            placeholder="Enter Password" required>
        </div>

        <div class="form-group">
            <select id="branch" required>
                <option value="">Select Branch</option>
                <option value="Main Branch">Main Branch</option>
                <option value="Branch 2">Branch 2</option>
                <option value="Branch 3">Branch 3</option>
            </select>
        </div>

        <div class="remember">
            <input type="checkbox" id="remember">
            <label for="remember">Remember Me</label>
        </div>

        <button type="submit" class="submit-btn">
            Submit
        </button>

        <button type="button" class="change-btn"
        onclick="changeCredentials()">
            Change Username & Password
        </button>

        <div class="links">
            <a href="#" onclick="forgotPassword(event)">
                Forgot Password?
            </a>
        </div>

    </form>
</div>

<script>

// Login Form
document.getElementById("loginForm").addEventListener("submit",
function(e) {
    e.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let branch = document.getElementById("branch").value;

    if(username && password && branch) {
        alert("Login Form Submitted Successfully!\nBranch: " + branch);

        // Yahan apna backend login API connect karein.
    }
});

// Change Username & Password
function changeCredentials() {
    alert("Please contact administrator to change username and password.");
}

// Forgot Password
function forgotPassword(e) {
    e.preventDefault();
    alert("Please contact administrator for password recovery.");
}

</script>

</body>
</html>
